<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-7">
                    <form action="{% url 'create_todo'%}" method="POST">
                        {% csrf_token %}
  <div class="mb-3">
    <label for="text" class="form-label">Title</label>
    <input type="text" class="form-control" id="text" aria-describedby="emailHelp" placeholder="Enter title" name=title>
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea name="description" id="" class="form-control"></textarea>
</div>
  <button type="submit" class="btn btn-dark">Add</button>
</form>

            </div>
        </div>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th>Sno.</th>
                <th>Title</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for todo in todos %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ todo.title}}</td>
                <td>{{ todo.description }}</td>
              <td>
    {% if todo.completed %}
        <button class="btn btn-sm btn-success" disabled>Completed</button>
    {% else %}
        <a href="{% url 'complete_todo' todo_id=todo.id %}" class="btn btn-sm btn-dark">Complete</a>
    {% endif %}
    <a href="{% url 'delete_todo' todo_id=todo.id %}" class="btn btn-sm btn-danger">Delete</a>
</td>

            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
